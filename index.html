<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Exploitation Framework</title>
    <link rel="stylesheet" href="style.css">
    <script>
        let isPS5 = false;

        function detectPlatform() {
            console.log("[DETECT] Checking platform...");
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;

            if (platform.includes("PlayStation") && userAgent.includes("10.60")) {
                isPS5 = true;
                document.getElementById("status").innerText = "PS5 10.60 Detected!";
                console.log("[DETECT] Platform is PS5 with firmware 10.60");
            } else {
                document.getElementById("status").innerText = "Unsupported Platform";
                console.error("[DETECT] Unsupported platform detected.");
            }
        }

        function loadScripts() {
            if (!isPS5) {
                alert("PS5 10.60 platform required.");
                return;
            }

            const scripts = [
                "./platform_module.js",
                "./utility_module.js",
                "./angler_memory_spray.js", // Angler's memory spraying logic
                "./Stage1_16.2_16.5.1_terrorbird.js",
                "./hello_world.js"
            ];

            scripts.forEach(script => {
                const scriptElement = document.createElement("script");
                scriptElement.src = script;
                scriptElement.async = false;
                scriptElement.onload = () => console.log(`[LOAD] ${script} loaded.`);
                scriptElement.onerror = () => console.error(`[LOAD] Error loading ${script}`);
                document.body.appendChild(scriptElement);
            });
        }

        function runExploit() {
            try {
                if (globalThis.r && globalThis.r.si) {
                    console.log("[RUN] Triggering Stage1 exploit...");
                    globalThis.r.si();
                } else {
                    console.error("[RUN] Exploit function not initialized (r.si undefined).");
                }
            } catch (err) {
                console.error("[RUN ERROR] Exploit failed:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            detectPlatform();
        });
    </script>
</head>
<body>
    <header>
        <h1>PS5 Exploitation Framework</h1>
        <p>Custom PS5 exploit for firmware 10.60 based on Angler's memory spray with Coruna's payloads.</p>
    </header>
    <main>
        <p>Status: <strong id="status">Detecting...</strong></p>
        <button onclick="loadScripts()">Load Scripts</button>
        <button onclick="runExploit()">Trigger Exploit</button>
    </main>
</body>
</html>
