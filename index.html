<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Exploitation Framework</title>
    <link rel="stylesheet" href="style.css">
    <script>
        let isPS5 = false; // Global flag for platform detection.

        // Detect PS5 platform and specific firmware version.
        function detectPlatform() {
            console.log("[DETECT] Checking platform...");
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;

            if (platform.includes("PlayStation") && userAgent.includes("10.60")) {
                isPS5 = true;
                document.getElementById("status").innerText = "PS5 10.60 Detected!";
                document.getElementById("status").className = "success";
                console.log("[DETECT] PS5 Detected: Firmware 10.60");
            } else {
                document.getElementById("status").innerText = "Unsupported Platform!";
                document.getElementById("status").className = "error";
                console.error("[DETECT] This platform is not supported.");
            }
        }

        // Load and initialize all modules sequentially.
        function loadScripts() {
            if (!isPS5) {
                alert("PS5 10.60 is required to load modules.");
                return;
            }

            const scripts = [
                "./platform_module.js",
                "./utility_module.js",
                "./Stage1_16.2_16.5.1_terrorbird.js",
                "./UMTX_exploit.js" // Load the UMTX-specific exploit logic.
            ];

            // Dynamically load each script one at a time.
            const loadScriptSequentially = (index) => {
                if (index >= scripts.length) {
                    document.getElementById("status").innerText = "Modules Loaded!";
                    document.getElementById("status").className = "success";
                    console.log("[LOAD] All modules loaded successfully.");
                    return;
                }

                const scriptElement = document.createElement("script");
                scriptElement.src = scripts[index];
                scriptElement.onload = () => {
                    console.log(`[LOAD] Loaded: ${scripts[index]}`);
                    loadScriptSequentially(index + 1); // Load the next script.
                };
                scriptElement.onerror = () => {
                    console.error(`[LOAD ERROR] Failed to load: ${scripts[index]}`);
                    alert(`Error loading script: ${scripts[index]}`);
                };
                document.body.appendChild(scriptElement);
            };

            loadScriptSequentially(0); // Start loading the scripts.
        }

        // Trigger the complete exploit process by combining Stage1 and UMTX behavior.
        function triggerExploit() {
            try {
                if (!isPS5) {
                    alert("Exploitation is only supported on PS5 firmware 10.60.");
                    return;
                }

                // Trigger Stage1 exploit if initialized.
                if (globalThis.r && globalThis.r.si) {
                    console.log("[TRIGGER] Starting Stage1 exploit...");
                    globalThis.r.si();
                }

                // Trigger UMTX exploit logic if available.
                if (typeof initializeUMTX === "function") {
                    console.log("[UMTX] Initializing UMTX Exploit...");
                    initializeUMTX();
                }

                // Optionally load Hello World payload after a small delay.
                setTimeout(() => {
                    console.log("[TRIGGER] Loading Hello World Payload...");
                    const helloWorldScript = document.createElement("script");
                    helloWorldScript.src = "./hello_world.js";
                    helloWorldScript.async = false;
                    document.body.appendChild(helloWorldScript);
                }, 3000);
            } catch (err) {
                console.error("[TRIGGER ERROR] Failed to execute exploit.", err);
                alert("Exploit failed! Check console for errors.");
            }
        }
    </script>
</head>
<body onload="detectPlatform()">
    <div class="container">
        <header>
            <h1>PS5 Exploitation Framework</h1>
            <p>Custom-built exploit targeting firmware version 10.60, including UMTX support.</p>
        </header>

        <div id="status-wrapper">
            <h2>Status: <span id="status">Detecting Platform...</span></h2>
        </div>

        <main>
            <button onclick="loadScripts()">Load Modules</button>
            <button onclick="triggerExploit()">Trigger Exploit & Load Payload</button>
        </main>

        <footer>
            <p>PS5 Exploitation Framework - For educational use only!</p>
        </footer>
    </div>
</body>
</html>
