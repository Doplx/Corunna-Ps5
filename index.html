<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS5 Exploitation Framework</title>
    <link rel="stylesheet" href="style.css">
    <script>
        let isPS5 = false;

        function detectPlatform() {
            console.log("[DETECT] Checking platform...");
            const platform = navigator.platform;
            const userAgent = navigator.userAgent;

            if (platform.includes("PlayStation") && userAgent.includes("10.60")) {
                isPS5 = true;
                document.getElementById("status").innerText = "PS5 10.60 Detected!";
                console.log("[DETECT] PS5 Detected: 10.60");
            } else {
                document.getElementById("status").innerText = "Unsupported Platform!";
                console.error("[DETECT] Unsupported platform.");
            }
        }

        function loadExploitScripts() {
            if (!isPS5) {
                alert("PS5 10.60 is required");
                return;
            }

            const scripts = [
                "./platform_module.js",
                "./utility_module.js",
                "./Stage1_16.2_16.5.1_terrorbird.js",
                "./hello_world.js"
            ];

            // Load all scripts sequentially
            scripts.forEach((script, index) => {
                const scriptElement = document.createElement("script");
                scriptElement.src = script;
                scriptElement.onload = () => console.log(`Loaded: ${script}`);
                scriptElement.onerror = () => console.error(`Failed to load: ${script}`);
                document.body.appendChild(scriptElement);
            });

            console.log("[LOAD] All exploit scripts loaded.");
        }

        function triggerExploit() {
            try {
                if (globalThis.r && globalThis.r.si) {
                    console.log("[TRIGGER] Running Stage1 Exploit...");
                    globalThis.r.si(); // Trigger Stage1 exploit.

                    // Wait and load payload after spraying is complete.
                    setTimeout(() => {
                        console.log("[TRIGGER] Loading Hello World Payload...");
                        const helloPayload = document.createElement("script");
                        helloPayload.src = "./hello_world.js";
                        helloPayload.async = false;
                        document.body.appendChild(helloPayload);
                    }, 3000);
                } else {
                    console.error("[ERROR] Exploit function is not initialized.");
                }
            } catch (error) {
                console.error("[ERROR] Failed to trigger exploit:", error);
                alert("Exploit failed. Check the console for errors.");
            }
        }
    </script>
</head>
<body onload="detectPlatform()">
    <div class="container">
        <header>
            <h1>PS5 Exploitation Framework</h1>
            <p>Custom-built exploit targeting firmware version 10.60.</p>
        </header>
        <div id="status-wrapper">
            <h2>Status: <span id="status">Detecting Platform...</span></h2>
        </div>
        <main>
            <button onclick="loadExploitScripts()">Load Exploit</button>
            <button onclick="triggerExploit()">Run Exploit</button>
        </main>
        <footer>
            <p>For educational purposes only</p>
        </footer>
    </div>
</body>
</html>
